name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME ($TAG) != Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi

      - name: Build release
        run: cargo build --release

      - name: Package binary + checksum
        run: |
          tar -C target/release -czf prd-state-aarch64-apple-darwin.tar.gz prd-state
          shasum -a 256 prd-state-aarch64-apple-darwin.tar.gz > prd-state-aarch64-apple-darwin.tar.gz.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            prd-state-aarch64-apple-darwin.tar.gz \
            prd-state-aarch64-apple-darwin.tar.gz.sha256
